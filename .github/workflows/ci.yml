name: Project's CI
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  native-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            name: x86_64-linux
          - runner: ubuntu-24.04-arm
            name: aarch64-linux
    name: 'native-build: ${{ matrix.name }}'
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Nix
        uses: ./.github/actions/nix-setup

      - name: Configure build
        run: meson setup builddir/

      - name: Build
        run: meson compile -C builddir/

      - name: Test
        run: meson test -C builddir/

      - name: Install the project
        run: |
          mkdir installroot
          meson install -C builddir/ --destdir installroot

      - name: Print install tree
        run: tree builddir/installroot/

  nix-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Nix
        uses: ./.github/actions/nix-setup

      - name: Check Nix flake
        run: nix flake check

      - name: Build $out output
        run: |
          nix build .#packages.x86_64-linux.default
          tree result

      - name: Build $dev output
        run: |
          nix build .#packages.x86_64-linux.default.dev
          tree result-dev

      - name: Build $doc output
        run: |
          nix build .#packages.x86_64-linux.default.doc
          tree result-doc

  run-pre-commit-hooks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Nix
        uses: ./.github/actions/nix-setup

      - name: Configure build
        run: meson setup builddir/

      - name: Run pre-commit hooks
        run: prek run --all-files
