name: Project's CI
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-native-x86_64:
    uses: ./.github/workflows/build.yml
    with:
      runner: ubuntu-24.04
      target: x86_64-linux
      job-name: 'Native build: x86_64-linux'

  build-native-aarch64:
    uses: ./.github/workflows/build.yml
    with:
      runner: ubuntu-24.04-arm
      target: aarch64-linux
      job-name: 'Native build: aarch64-linux'

  build-cross-x86_64-to-aarch64:
    uses: ./.github/workflows/build.yml
    with:
      runner: ubuntu-24.04
      target: aarch64-linux
      job-name: 'Cross build: x86_64-linux -> aarch64-linux'

  build-cross-aarch64-to-x86_64:
    uses: ./.github/workflows/build.yml
    with:
      runner: ubuntu-24.04-arm
      target: x86_64-linux
      job-name: 'Cross build: aarch64-linux -> x86_64-linux'

  run-pre-commit-hooks:
    name: Run pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Nix
        uses: ./.github/actions/nix-setup

      - name: Configure build
        run: meson setup builddir/

      - name: Run pre-commit hooks
        run: prek run --all-files
